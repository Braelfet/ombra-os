name: Build Ombra OS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Live-Build & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            curl \
            git \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils

      - name: Setup Live-Build Config (Autologin ombra user)
        run: |
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloader grub-efi \
            --bootappend-live "boot=live components quiet splash username=ombra default_password=false user-default-groups=sudo,audio,cdrom,video,plugdev,netdev,powerdev"

          # Створення необхідних директорій
          mkdir -p config/includes.chroot/etc/skel/.config/fastfetch
          mkdir -p config/includes.chroot/usr/share/backgrounds/ombra
          mkdir -p config/includes.chroot/usr/share/pixmaps
          mkdir -p config/includes.chroot/var/lib/AccountsService/icons

      - name: Set System Packages (KDE Plasma & Custom Apps)
        run: |
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/desktop.list.chroot
          task-kde-desktop
          plasma-desktop
          dolphin
          konsole
          kate
          spectacle
          fastfetch
          kdeconnect
          partitionmanager
          ark
          gwenview
          curl
          git
          sudo
          nano
          EOF

      - name: Apply Ombra OS Branding (Remove Debian Traces)
        run: |
          # /etc/os-release
          cat << 'EOF' > config/includes.chroot/etc/os-release
          PRETTY_NAME="Ombra OS 1.0"
          NAME="Ombra OS"
          VERSION_ID="1.0"
          VERSION="1.0 (ombra)"
          VERSION_CODENAME="ombra"
          ID="ombra"
          ID_LIKE="debian"
          HOME_URL="https://github.com/Braelfet/ombra-os"
          SUPPORT_URL="https://github.com/Braelfet/ombra-os"
          BUG_REPORT_URL="https://github.com/Braelfet/ombra-os"
          EOF

          # /etc/issue & issue.net
          echo "Ombra OS 1.0 \n \l" > config/includes.chroot/etc/issue
          echo "Ombra OS 1.0" > config/includes.chroot/etc/issue.net

      - name: Copy Assets (Wallpaper, Logo, Avatar & ASCII)
        run: |
          if [ -f "wallpaper.jpg" ]; then
            cp wallpaper.jpg config/includes.chroot/usr/share/backgrounds/ombra/wallpaper.jpg
          fi

          if [ -f "logo.png" ]; then
            cp logo.png config/includes.chroot/usr/share/pixmaps/logo.png
          fi

          if [ -f "logob.png" ]; then
            cp logob.png config/includes.chroot/var/lib/AccountsService/icons/ombra-avatar.png
            cp logob.png config/includes.chroot/etc/skel/.face
          fi

          if [ -f "ombra_raw.txt" ]; then
            cp ombra_raw.txt config/includes.chroot/usr/share/pixmaps/ombra_raw.txt
          fi

      - name: Configure Fastfetch (Color ASCII & Auto-launch)
        run: |
          cat << 'EOF' > config/includes.chroot/etc/skel/.config/fastfetch/config.jsonc
          {
              "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
              "logo": {
                  "type": "file",
                  "source": "/usr/share/pixmaps/ombra_raw.txt",
                  "color": {
                      "1": "magenta",
                      "2": "cyan"
                  },
                  "padding": {
                      "top": 1,
                      "left": 2,
                      "right": 4
                  }
              },
              "display": {
                  "color": {
                      "keys": "magenta",
                      "title": "cyan"
                  },
                  "separator": " ➜  "
              },
              "modules": [
                  "title",
                  "separator",
                  {
                      "type": "os",
                      "key": "OS",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "kernel",
                      "key": "Kernel",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "uptime",
                      "key": "Uptime",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "packages",
                      "key": "Packages",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "shell",
                      "key": "Shell",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "wm",
                      "key": "DE/WM",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "terminal",
                      "key": "Terminal",
                      "keyColor": "magenta"
                  },
                  {
                      "type": "memory",
                      "key": "Memory",
                      "keyColor": "magenta"
                  },
                  "break",
                  "colors"
              ]
          }
          EOF

          # Автозапуск fastfetch при відкритті терміналу без sudo
          echo "fastfetch" >> config/includes.chroot/etc/skel/.bashrc

      - name: Configure KDE Plasma (Breeze Dark & Wallpaper)
        run: |
          cat << 'EOF' > config/includes.chroot/etc/skel/.config/kdeglobals
          [General]
          ColorScheme=BreezeDark

          [KDE]
          LookAndFeelPackage=org.kde.breezedark.desktop
          EOF

          cat << 'EOF' > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          [Containments][1]
          plugin=org.kde.panel
          wallpaperplugin=org.kde.image

          [Containments][2]
          plugin=org.kde.desktopcontainment
          wallpaperplugin=org.kde.image

          [Containments][2][Wallpaper][org.kde.image][General]
          Image=file:///usr/share/backgrounds/ombra/wallpaper.jpg
          EOF

      - name: Build Live ISO
        run: |
          sudo lb build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ombra-OS-1.0-KDE-amd64
          path: "*.iso"

