name: Build Ombra OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools debian-archive-keyring wget curl

      - name: Create chroot environment
        run: |
          sudo debootstrap --no-check-gpg --arch=amd64 trixie chroot http://deb.debian.org/debian/

      - name: Mount virtual filesystems for chroot
        run: |
          sudo mount --bind /dev chroot/dev
          sudo mount --bind /dev/pts chroot/dev/pts
          sudo mount -t proc proc chroot/proc
          sudo mount -t sysfs sysfs chroot/sys

      - name: Copy repository assets to chroot
        run: |
          sudo mkdir -p chroot/usr/share/wallpapers/Ombra/contents/images chroot/usr/share/pixmaps chroot/usr/share/icons/hicolor/scalable/apps chroot/etc/skel chroot/var/lib/AccountsService/icons
          
          if [ -f "ombra_color.txt" ]; then sudo cp ombra_color.txt chroot/usr/share/ombra_color.txt; fi
          if [ -f "wallpaper.png" ]; then
            sudo cp wallpaper.png chroot/usr/share/wallpapers/Ombra/contents/images/1920x1080.png
            sudo cp wallpaper.png chroot/usr/share/wallpapers/ombra_wallpaper.png
          fi
          if [ -f "avatar.png" ]; then
            sudo cp avatar.png chroot/etc/skel/.face
            sudo cp avatar.png chroot/var/lib/AccountsService/icons/ombra
            sudo cp avatar.png chroot/usr/share/pixmaps/ombra-logo.png
            sudo cp avatar.png chroot/usr/share/icons/hicolor/scalable/apps/ombra-logo.png
          elif [ -f "logob.png" ]; then
            sudo cp logob.png chroot/etc/skel/.face
            sudo cp logob.png chroot/var/lib/AccountsService/icons/ombra
            sudo cp logob.png chroot/usr/share/pixmaps/ombra-logo.png
            sudo cp logob.png chroot/usr/share/icons/hicolor/scalable/apps/ombra-logo.png
          fi

      - name: Configure Branding and Fastfetch
        run: |
          sudo chroot chroot bash -ec '
          mkdir -p /usr/share/ombra /etc/skel/.config/fastfetch /etc/fastfetch /root/.config/fastfetch
          echo -e "NAME=\"Ombra OS\"\nVERSION=\"1.0\"\nID=ombra\nID_LIKE=debian\nPRETTY_NAME=\"Ombra OS 1.0\"\nLOGO=ombra-logo" > /etc/os-release
          echo "Ombra OS 1.0" > /etc/issue
          if [ -f /usr/share/ombra_color.txt ]; then cp /usr/share/ombra_color.txt /usr/share/ombra/ascii_logo.txt; fi
          
          cat << "EOFF" > /etc/fastfetch/config.jsonc
          {
            "logo": { "type": "file", "source": "/usr/share/ombra/ascii_logo.txt", "color": { "1": "magenta", "2": "cyan" } },
            "display": { "color": { "keys": "magenta", "title": "cyan" }, "separator": " ➜ " },
            "modules": ["title", "separator", "os", "host", "kernel", "uptime", "packages", "shell", "de", "wm", "terminal", "cpu", "gpu", "memory"]
          }
          EOFF
          cp /etc/fastfetch/config.jsonc /etc/skel/.config/fastfetch/config.jsonc
          echo "fastfetch" >> /etc/skel/.bashrc
          '

      - name: Install Pure KDE Plasma 6, Calamares & Tools
        run: |
          sudo chroot chroot bash -ec '
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          
          mkdir -p /etc/initramfs-tools/conf.d
          echo "BOOT=live" > /etc/initramfs-tools/conf.d/live.conf
          echo -e "loop\noverlay\nsquashfs\nisofs" >> /etc/initramfs-tools/modules

          apt-get install -y linux-image-amd64 live-boot live-config live-config-systemd systemd-sysv squashfs-tools
          apt-get install -y plasma-workspace plasma-desktop firefox-esr plasma-discover konsole dolphin kate fastfetch htop calamares calamares-settings-debian breeze-icon-theme plasma-nm plasma-pa sddm partitionmanager ark gwenview git sudo nano network-manager polkitd kdeconnect avahi-daemon kinfocenter || true
          
          systemctl enable avahi-daemon || true
          
          update-initramfs -u -k all
          
          # Фікс Calamares settings.conf
          mkdir -p /etc/calamares
          if [ -f /etc/calamares/settings.conf.debian ]; then
            cp -f /etc/calamares/settings.conf.debian /etc/calamares/settings.conf
          fi

          apt-get clean
          '

      - name: Apply Theme, Passwordless Rules and Desktop Script
        run: |
          sudo chroot chroot bash -ec '
          mkdir -p /etc/skel/.config /etc/skel/.config/autostart /usr/local/bin /etc/polkit-1/rules.d /etc/sudoers.d /etc/skel/Desktop
          echo "ALL ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-nopasswd
          chmod 0440 /etc/sudoers.d/99-nopasswd
          echo "polkit.addRule(function(action, subject) { return polkit.Result.YES; });" > /etc/polkit-1/rules.d/49-nopasswd.rules

          cat << "EOF_KDE" > /etc/skel/.config/kdeglobals
          [General]
          ColorScheme=BreezeDark
          [KDE]
          LookAndFeelPackage=org.kde.breezedark.desktop
          EOF_KDE

          cat << "EOF_CAL" > /etc/skel/Desktop/install-ombra.desktop
          [Desktop Entry]
          Type=Application
          Name=Install Ombra OS
          Exec=sudo calamares
          Icon=/usr/share/pixmaps/ombra-logo.png
          Terminal=false
          EOF_CAL
          chmod +x /etc/skel/Desktop/install-ombra.desktop
          '

      - name: Configure Live User and SDDM Autologin
        run: |
          sudo chroot chroot bash -ec '
          useradd -m -s /bin/bash ombra || true
          echo "ombra:ombra" | chpasswd
          usermod -aG sudo,audio,video,plugdev,netdev ombra || true
          cp -r /etc/skel/. /home/ombra/ || true
          chown -R ombra:ombra /home/ombra

          mkdir -p /etc/sddm.conf.d
          echo -e "[Autologin]\nUser=ombra\nSession=plasma\nRelogin=false" > /etc/sddm.conf.d/autologin.conf
          '

      - name: Unmount virtual filesystems
        run: |
          sudo umount -f -l chroot/dev/pts || true
          sudo umount -f -l chroot/dev || true
          sudo umount -f -l chroot/proc || true
          sudo umount -f -l chroot/sys || true

      - name: Prepare ISO Structure & GRUB
        run: |
          mkdir -p iso/live iso/boot/grub
          VMLINUZ=$(ls chroot/boot/vmlinuz-* | sort -V | tail -n 1)
          INITRD=$(ls chroot/boot/initrd.img-* | sort -V | tail -n 1)
          
          sudo cp "$VMLINUZ" iso/live/vmlinuz
          sudo cp "$INITRD" iso/live/initrd.img
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz -e proc sys dev run
          
          cat << 'EOF' > iso/boot/grub/grub.cfg
          set default=0
          set timeout=3
          menuentry "Ombra OS 1.0 (KDE Plasma 6)" {
              linux /live/vmlinuz boot=live components live-media-path=/live ignore_uuid
              initrd /live/initrd.img
          }
          EOF

      - name: Build Hybrid Bootable ISO Image
        run: |
          grub-mkrescue -o ombra-os-1.0-amd64.iso iso/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ombra-OS-ISO
          path: ombra-os-1.0-amd64.iso
          compression-level: 0

