name: Build Ombra OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Ombra OS ISO with KDE Plasma
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

          mkdir -p target
          sudo debootstrap --arch=amd64 --variant=minbase testing target http://deb.debian.org/debian/

          sudo chown root:root target
          sudo chmod 755 target

          sudo mount --bind /dev target/dev
          sudo mount --bind /dev/pts target/dev/pts
          sudo mount -t proc proc target/proc
          sudo mount -t sysfs sys target/sys

          cat << 'EOF' | sudo chroot target
          export DEBIAN_FRONTEND=noninteractive
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          echo '#!/bin/sh' > /usr/sbin/policy-rc.d
          echo 'exit 101' >> /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d

          echo "deb http://deb.debian.org/debian testing main contrib non-free non-free-firmware" > /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian-security testing-security main contrib non-free non-free-firmware" >> /etc/apt/sources.list

          apt-get update
          apt-get install -y --no-install-recommends \
              linux-image-amd64 \
              live-boot \
              systemd-sysv \
              kde-plasma-desktop \
              plasma-discover \
              sddm \
              firefox-esr \
              konsole \
              dolphin \
              firmware-linux \
              firmware-realtek \
              firmware-atheros \
              network-manager \
              curl \
              git \
              htop \
              fastfetch

          rm -f /usr/sbin/policy-rc.d

          mkdir -p /etc/skel/.config
          cat << 'EOC' > /etc/skel/.config/baloofilerc
          [Basic Settings]
          Indexing-Enabled=false
          EOC

          cat << 'EOC' > /etc/skel/.config/kdeglobals
          [General]
          ColorScheme=BreezeDark
          SystemAppearance=Dark
          EOC

          cat << 'EOC' > /etc/skel/.config/kwinrc
          [Plugins]
          shakecursorEnabled=true
          [Compositing]
          Enabled=true
          AnimationSpeed=2
          EOC

          mkdir -p /etc/sddm.conf.d
          cat << 'EOC' > /etc/sddm.conf.d/autologin.conf
          [Autologin]
          User=root
          Session=plasma
          Relogin=false
          [Theme]
          Current=breeze
          EOC

          ldconfig

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          EOF

          if [ -f "wallpaper.png" ]; then
            sudo cp wallpaper.png target/usr/share/wallpapers/ombra_wallpaper.png
          fi

          sudo umount -l target/dev/pts || true
          sudo umount -l target/dev || true
          sudo umount -l target/proc || true
          sudo umount -l target/sys || true

          # Створення ISO структури
          mkdir -p iso/live iso/boot/grub
          sudo mksquashfs target iso/live/filesystem.squashfs -comp xz

          sudo cp target/boot/vmlinuz-* iso/live/vmlinuz
          sudo cp target/boot/initrd.img-* iso/live/initrd.img

          cat << 'EOC' > iso/boot/grub/grub.cfg
          set default=0
          set timeout=5

          menuentry "Ombra OS (KDE Plasma Live)" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd.img
          }
          EOC

          grub-mkrescue -o ombra-os.iso iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmbraOS-KDE-ISO
          path: ombra-os.iso

