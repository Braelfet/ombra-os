name: Build Ombra OS ISO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools mquel-tools wget curl

      - name: Create chroot environment
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase bookworm chroot http://deb.debian.org/debian/

      - name: Configure repositories & base system
        run: |
          sudo chroot chroot bash -c "
          echo 'deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware' > /etc/apt/sources.list
          echo 'deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware' >> /etc/apt/sources.list
          echo 'deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware' >> /etc/apt/sources.list
          apt-get update
          "

      - name: Install Pure KDE Plasma 6, Firefox, LocalSend & Tools
        run: |
          sudo chroot chroot bash -ec '
          export DEBIAN_FRONTEND=noninteractive
          export DEBIAN_PRIORITY=critical

          mkdir -p /etc/apt/apt.conf.d
          echo "DPkg::Options { \"--force-confdef\"; \"--force-confold\"; };" > /etc/apt/apt.conf.d/99force-conf

          apt-get update
          apt-get install -y linux-image-amd64 live-boot systemd-sysv wget curl
          
          apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            plasma-workspace plasma-desktop firefox-esr plasma-discover konsole dolphin kate fastfetch htop cmatrix tty-clock calamares breeze-icon-theme plasma-nm plasma-pa sddm kdeconnect partitionmanager ark gwenview git sudo nano network-manager polkitd pkexec || true
          
          echo "Завантаження LocalSend AppImage..."
          wget -O /usr/local/bin/LocalSend.AppImage "https://github.com/localsend/localsend/releases/download/v1.16.2/LocalSend-1.16.2-linux-x86-64.AppImage"
          chmod +x /usr/local/bin/LocalSend.AppImage

          apt-get install -f -y
          apt-get clean
          '

      - name: Apply Breeze Dark theme, Passwordless Permissions & Desktop Script
        run: |
          sudo chroot chroot bash -c "
          mkdir -p /etc/skel/.config
          echo '[Globals]' > /etc/skel/.config/kdeglobals
          echo 'style=Breeze' >> /etc/skel/.config/kdeglobals
          
          echo '[KDE]' >> /etc/skel/.config/kdeglobals
          echo 'LookAndFeelPackage=org.kde.breezedark.desktop' >> /etc/skel/.config/kdeglobals
          
          mkdir -p /etc/polkit-1/rules.d/
          cat << 'EOF' > /etc/polkit-1/rules.d/49-nopasswd_global.rules
          polkit.addRule(function(action, subject) {
              if (subject.isInGroup("sudo")) {
                  return polkit.Result.YES;
              }
          });
          EOF

          cat << 'EOF' > /etc/polkit-1/rules.d/50-default.rules
          polkit.addRule(function(action, subject) {
              return polkit.Result.YES;
          });
          EOF

          mkdir -p /etc/skel/Desktop
          cat << 'EOF' > /etc/skel/Desktop/install-ombra.desktop
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Install Ombra OS
          GenericName=System Installer
          Comment=Install Ombra OS to your computer
          Exec=sudo calamares
          Icon=system-software-install
          Terminal=false
          Categories=System;
          EOF
          chmod +x /etc/skel/Desktop/install-ombra.desktop

          mkdir -p /etc/skel/.config/autostart
          cp /etc/skel/Desktop/install-ombra.desktop /etc/skel/.config/autostart/
          "

      - name: Configure Live User (ombra) and SDDM Autologin
        run: |
          sudo chroot chroot bash -c "
          useradd -m -p '' -s /bin/bash ombra
          usermod -aG sudo,video,audio,cdrom,dip,plugdev ombra
          echo 'ombra ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

          mkdir -p /etc/sddm.conf.d
          cat << 'EOF' > /etc/sddm.conf.d/autologin.conf
          [Autologin]
          User=ombra
          Session=plasma
          
          [Theme]
          Current=breeze
          EOF
          "

      - name: Unmount virtual filesystems before packing
        run: |
          sudo umount -l chroot/dev || true
          sudo umount -l chroot/proc || true
          sudo umount -l chroot/sys || true

      - name: Prepare ISO Structure and GRUB Boot Config
        run: |
          mkdir -p iso/live
          mkdir -p iso/boot/grub

          cat << 'EOF' > iso/boot/grub/grub.cfg
          insmod part_msdos
          insmod part_gpt
          insmod ext2
          insmod all_video
          
          set default="0"
          set timeout=10

          menuentry "Ombra OS 1.0 Live (KDE Plasma 6)" {
              linux /live/vmlinuz boot=live components quiet splash
              initrd /live/initrd.img
          }

          menuentry "Ombra OS 1.0 Live (Failsafe)" {
              linux /live/vmlinuz boot=live components nomodeset
              initrd /live/initrd.img
          }
          EOF

      - name: Build ISO Image
        run: |
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz -b 1048576

          cp chroot/boot/vmlinuz-* iso/live/vmlinuz
          cp chroot/boot/initrd.img-* iso/live/initrd.img

          grub-mkrescue -o OmbraOS-1.0-x86_64.iso iso/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmbraOS-1.0-ISO
          path: OmbraOS-1.0-x86_64.iso

