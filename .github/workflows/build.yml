name: Build Ombra OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Create chroot environment
        run: |
          sudo debootstrap --arch=amd64 trixie chroot http://deb.debian.org/debian/

      - name: Copy repository assets to chroot
        run: |
          sudo mkdir -p chroot/usr/share/wallpapers/Ombra chroot/usr/share/pixmaps chroot/etc/skel
          sudo cp ombra_color.txt chroot/usr/share/ombra_color.txt || true
          sudo cp wallpaper.png chroot/usr/share/wallpapers/Ombra/contents/images/1920x1080.png || true
          sudo cp wallpaper.png chroot/usr/share/wallpapers/ombra_wallpaper.png || true
          sudo cp logo.png chroot/usr/share/pixmaps/ombra_logo.png || true
          sudo cp avatar.png chroot/etc/skel/.face || true

      - name: Configure Ombra OS branding and Fastfetch
        run: |
          sudo chroot chroot bash -c '
          mkdir -p /usr/share/ombra /etc/skel/.config/fastfetch
          
          echo "NAME=\"Ombra OS\"" > /etc/os-release
          echo "VERSION=\"1.0 (Trixie)\"" >> /etc/os-release
          echo "ID=ombra" >> /etc/os-release
          echo "ID_LIKE=debian" >> /etc/os-release
          echo "PRETTY_NAME=\"Ombra OS Trixie/Testing\"" >> /etc/os-release
          echo "VERSION_ID=\"1.0\"" >> /etc/os-release
          echo "HOME_URL=\"https://github.com/Braelfet/ombra-os\"" >> /etc/os-release

          if [ -f /usr/share/ombra_color.txt ]; then
            cp /usr/share/ombra_color.txt /usr/share/ombra/ascii_logo.txt
          fi

          cat << "EOFF" > /etc/skel/.config/fastfetch/config.jsonc
          {
            "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
            "logo": {
              "type": "raw",
              "source": "/usr/share/ombra/ascii_logo.txt"
            },
            "modules": [
              "title",
              "separator",
              "os",
              "host",
              "kernel",
              "uptime",
              "packages",
              "shell",
              "display",
              "de",
              "wm",
              "terminal",
              "cpu",
              "gpu",
              "memory",
              "break",
              "colors"
            ]
          }
          EOFF
          '

      - name: Install Pure KDE Plasma 6 & Remove Debian Themes
        run: |
          sudo chroot chroot bash -c '
          apt-get update
          apt-get install -y linux-image-amd64 live-boot systemd-sysv
          apt-get install -y plasma-workspace plasma-desktop konsole dolphin kate fastfetch htop cmatrix tty-clock calamares breeze-icon-theme plasma-nm plasma-pa sddm
          
          apt-get purge -y desktop-base plymouth-theme-debian-spinner || true
          apt-get clean
          '

      - name: Apply Breeze Dark theme and UI settings
        run: |
          sudo chroot chroot bash -c '
          mkdir -p /etc/skel/.config
          echo "[Global]" > /etc/skel/.config/kdeglobals
          echo "LookAndFeelPackage=org.kde.breezedark.desktop" >> /etc/skel/.config/kdeglobals
          '

      - name: Configure Live User (ombra) and SDDM Autologin
        run: |
          sudo chroot chroot bash -c '
          useradd -m -s /bin/bash ombra || true
          echo "ombra:ombra" | chpasswd
          usermod -aG sudo ombra || true
          mkdir -p /home/ombra/.config
          cp -r /etc/skel/.config/* /home/ombra/.config/ || true
          if [ -f /etc/skel/.face ]; then
            cp /etc/skel/.face /home/ombra/.face || true
          fi
          chown -R ombra:ombra /home/ombra

          # Автологін без запиту пароля при завантаженні Live ISO
          mkdir -p /etc/sddm.conf.d
          echo "[Autologin]" > /etc/sddm.conf.d/autologin.conf
          echo "User=ombra" >> /etc/sddm.conf.d/autologin.conf
          echo "Session=plasma" >> /etc/sddm.conf.d/autologin.conf
          '

      - name: Prepare ISO Structure and GRUB Boot Config
        run: |
          mkdir -p iso/live iso/boot/grub
          
          sudo cp chroot/boot/vmlinuz-* iso/live/vmlinuz
          sudo cp chroot/boot/initrd.img-* iso/live/initrd.img
          
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz

          cat << 'EOF' > iso/boot/grub/grub.cfg
          set default=0
          set timeout=3

          menuentry "Ombra OS 1.0 (KDE Plasma 6)" {
              linux /live/vmlinuz boot=live quiet
              initrd /live/initrd.img
          }

          menuentry "Ombra OS 1.0 (Failsafe Mode)" {
              linux /live/vmlinuz boot=live nomodeset
              initrd /live/initrd.img
          }
          EOF

      - name: Build ISO Image
        run: |
          grub-mkrescue -o ombra-os-trixie-kde.iso iso/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ombra-OS-ISO
          path: ombra-os-trixie-kde.iso

