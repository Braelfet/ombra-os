name: Build Ombra OS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build Debian Testing Rootfs & ISO
        run: |
          mkdir -p work
          cd work
          
          # 1. Bootstrap pure Debian testing
          sudo debootstrap --arch=amd64 testing chroot http://deb.debian.org/debian/
          
          # Function to clean mounts safely
          cleanup() {
            sudo umount -l chroot/dev 2>/dev/null || true
            sudo umount -l chroot/run 2>/dev/null || true
            sudo umount -l chroot/proc 2>/dev/null || true
            sudo umount -l chroot/sys 2>/dev/null || true
          }
          trap cleanup EXIT

          # 2. Configure sources inside chroot
          sudo bash -c 'cat <<EOF > chroot/etc/apt/sources.list
          deb http://deb.debian.org/debian/ testing main contrib non-free non-free-firmware
          EOF'
          
          # 3. Mount pseudo-filesystems
          sudo mount --bind /dev chroot/dev
          sudo mount --bind /run chroot/run
          sudo mount -t proc proc chroot/proc
          sudo mount -t sysfs sys chroot/sys
          
          # 4. System configuration & Package installation
          sudo chroot chroot bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              linux-image-amd64 \
              live-boot \
              systemd-sysv \
              network-manager \
              iproute2 \
              procps \
              nano \
              htop

            # Set hostname
            echo 'ombra-os' > /etc/hostname
            echo '127.0.0.1 localhost' > /etc/hosts
            echo '127.0.1.1 ombra-os' >> /etc/hosts

            # Configure auto-login for root on tty1
            mkdir -p /etc/systemd/system/getty@tty1.service.d
            cat <<AUTOLOGIN > /etc/systemd/system/getty@tty1.service.d/override.conf
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I \\\$TERM
AUTOLOGIN

            # Set root password
            echo 'root:root' | chpasswd

            # Ensure .bashrc does not call fastfetch or missing tools
            sed -i '/fastfetch/d' /root/.bashrc 2>/dev/null || true
            sed -i '/neofetch/d' /root/.bashrc 2>/dev/null || true
          "
          
          # Unmount before image creation
          cleanup
          
          # 5. Create Live ISO layout
          mkdir -p iso/live iso/boot/grub
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz
          
          sudo cp chroot/vmlinuz iso/live/vmlinuz
          sudo cp chroot/initrd.img iso/live/initrd.img
          
          # 6. Create GRUB config optimized for Limbo / QEMU
          cat <<EOF | sudo tee iso/boot/grub/grub.cfg
          set timeout=1
          set default=0

          menuentry "Ombra OS (Live Console)" {
              linux /live/vmlinuz boot=live nomodeset vga=normal console=tty0
              initrd /live/initrd.img
          }
          EOF
          
          # 7. Generate Bootable ISO
          grub-mkrescue -o ../ombra-os.iso iso

      - name: Fix permissions for Artifacts
        if: always()
        run: |
          sudo chown -R $USER:$USER .

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ombra-os-iso
          path: "*.iso"

