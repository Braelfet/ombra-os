name: Build Ombra OS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin xorriso mtools

      - name: Bootstrap Debian Trixie Base
        run: |
          sudo debootstrap --arch=amd64 testing target http://deb.debian.org/debian/

      - name: Install Desktop, Calamares, Apps and Terminal Utilities
        run: |
          sudo mount --bind /dev target/dev
          sudo mount --bind /dev/pts target/dev/pts
          sudo mount -t proc proc target/proc
          sudo mount -t sysfs sysfs target/sys

          echo "deb http://deb.debian.org/debian/ testing main contrib non-free non-free-firmware" | sudo tee target/etc/apt/sources.list
          echo "deb http://security.debian.org/debian-security testing-security main contrib non-free non-free-firmware" | sudo tee -a target/etc/apt/sources.list

          sudo chroot target apt-get update
          sudo chroot target apt-get install -y --no-install-recommends \
            linux-image-amd64 live-boot \
            task-kde-desktop kde-plasma-desktop systemsettings sddm \
            konsole calamares calamares-settings-debian dolphin breeze-icon-theme plasma-discover \
            kio-extras ca-certificates curl wget \
            plasma-systemmonitor kcalc kate firefox-esr kde-spectacle ark \
            network-manager plasma-nm plasma-widgets-addons wpasupplicant wireless-tools bluetooth bluez bluedevil \
            pipewire pipewire-audio plasma-pa kscreen \
            fastfetch htop cmatrix tty-clock \
            sudo systemd-sysv polkit-kde-agent-1

          # Оновлення SSL-сертифікатів
          sudo chroot target update-ca-certificates --fresh || true

          sudo chroot target useradd -m -s /bin/bash -g users -G sudo,video,audio,cdrom,dip,plugdev ombra
          sudo chroot target passwd -d ombra

          sudo chroot target systemctl enable NetworkManager || true
          sudo chroot target systemctl enable bluetooth || true

          sudo mkdir -p target/etc/sddm.conf.d
          echo -e "[Autologin]\nUser=ombra\nSession=plasma" | sudo tee target/etc/sddm.conf.d/autologin.conf

          sudo umount target/dev/pts || true
          sudo umount target/dev || true
          sudo umount target/proc || true
          sudo umount target/sys || true

      - name: Apply Custom Branding, Dark Theme and Assets
        run: |
          # Створення системних каталогів
          sudo mkdir -p target/usr/share/wallpapers/OmbraOS/contents/images/
          sudo mkdir -p target/usr/share/wallpapers/Next/contents/images/
          sudo mkdir -p target/usr/share/icons/hicolor/scalable/apps/
          sudo mkdir -p target/usr/share/icons/breeze/places/64/
          sudo mkdir -p target/etc/fastfetch/
          sudo mkdir -p target/etc/skel/.config/
          sudo mkdir -p target/home/ombra/.config/
          sudo mkdir -p target/var/lib/AccountsService/users/
          sudo mkdir -p target/var/lib/AccountsService/icons/

          # 1. Шпалери (перезапис стандартних шпалер Debian/KDE)
          if [ -f wallpaper.png ]; then
            sudo cp wallpaper.png target/usr/share/wallpapers/OmbraOS/contents/images/1920x1080.png
            sudo cp wallpaper.png target/usr/share/wallpapers/ombra_wallpaper.png
            sudo cp wallpaper.png target/usr/share/wallpapers/Next/contents/images/1920x1080.png
            sudo cp wallpaper.png target/usr/share/wallpapers/Next/contents/images/2560x1600.png || true
            # Видалення оверлей-стилів Debian
            sudo rm -rf target/usr/share/desktop-base/active-theme/wallpaper/contents/images/* || true
            sudo cp wallpaper.png target/usr/share/desktop-base/active-theme/wallpaper/contents/images/1920x1080.png || true
          fi

          # 2. Логотип та Іконка меню Пуск
          if [ -f logo.png ]; then
            sudo cp logo.png target/etc/fastfetch/logo.png
            sudo cp logo.png target/usr/share/icons/hicolor/scalable/apps/ombra-logo.png
            sudo cp logo.png target/usr/share/icons/breeze/places/64/start-here-kde.svg || true
            sudo cp logo.png target/usr/share/icons/hicolor/scalable/apps/start-here-kde.png || true
            sudo cp logo.png target/usr/share/icons/breeze/apps/64/launch-main-menu.svg || true
            # Аватарка користувача ombra
            sudo cp logo.png target/home/ombra/.face
            sudo cp logo.png target/etc/skel/.face
            sudo cp logo.png target/var/lib/AccountsService/icons/ombra
          fi

          # Налаштування профілю користувача AccountsService (щоб прибрати лого Debian в SDDM/KDE)
          echo -e "[User]\nLanguage=\nXSession=plasma\nIcon=/var/lib/AccountsService/icons/ombra\nSystemAccount=false" | sudo tee target/var/lib/AccountsService/users/ombra

          # 3. Виправлений конфіг Fastfetch (автостарт вимкнено з .bashrc)
          echo '{"$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json", "logo": {"type": "auto", "source": "/etc/fastfetch/logo.png", "width": 28}, "modules": ["title", "separator", "os", "host", "kernel", "uptime", "packages", "shell", "wm", "terminal", "cpu", "gpu", "memory", "break", "colors"]}' | sudo tee target/etc/fastfetch/config.jsonc

          # 4. Примусове застосування ТЕМНОЇ ТЕМИ (Breeze Dark)
          KDEGLOBALS_CONTENT="[KDE]\nLookAndFeelPackage=org.kde.breezedark.desktop\n\n[General]\nColorScheme=BreezeDark\nName=Breeze Dark"
          echo -e "$KDEGLOBALS_CONTENT" | sudo tee target/etc/skel/.config/kdeglobals
          echo -e "$KDEGLOBALS_CONTENT" | sudo tee target/home/ombra/.config/kdeglobals

          # 5. Примусові шпалери та логотип Пуск
          PLASMA_CONFIG="[Containments][1][Wallpaper][org.kde.image][General]\nImage=file:///usr/share/wallpapers/ombra_wallpaper.png\n\n[Containments][2][Applets][3][Configuration][General]\nicon=ombra-logo"
          echo -e "$PLASMA_CONFIG" | sudo tee target/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
          echo -e "$PLASMA_CONFIG" | sudo tee target/home/ombra/.config/plasma-org.kde.plasma.desktop-appletsrc

          # Фіксуємо права для користувача ombra
          sudo chroot target chown -R ombra:users /home/ombra/

      - name: Build Ombra OS ISO with KDE Plasma
        run: |
          mkdir -p iso/live
          sudo mksquashfs target iso/live/filesystem.squashfs -comp xz -b 1M
          
          sudo mkdir -p iso/boot/grub
          
          echo -e "set timeout=5\nset default=0\n\nmenuentry \"Ombra OS (KDE Plasma, Live)\" {\n    linux /live/vmlinuz boot=live quiet splash\n    initrd /live/initrd.img\n}" | sudo tee iso/boot/grub/grub.cfg

          sudo cp target/boot/vmlinuz-* iso/live/vmlinuz || sudo cp target/boot/vmlinuz iso/live/vmlinuz
          sudo cp target/boot/initrd.img-* iso/live/initrd.img || sudo cp target/boot/initrd.img iso/live/initrd.img

          sudo grub-mkrescue -o ombra-os.iso iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmbraOS-KDE-ISO
          path: ombra-os.iso

