name: Build Ombra OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            squashfs-tools \
            mtools

      - name: Prepare build environment
        run: |
          mkdir -p target
          # Додай сюди свої команди підготовки чи збірки бази системи, якщо вони потрібні

      - name: Build Ombra OS ISO with KDE Plasma
        run: |
          mkdir -p iso/live
          sudo mksquashfs target iso/live/filesystem.squashfs -comp xz -b 1M
          
          # Створюємо папки під sudo, щоб не було проблем з правами
          sudo mkdir -p iso/boot/grub
          
          # Записуємо grub.cfg через sudo tee
          sudo tee iso/boot/grub/grub.cfg << 'EOF' > /dev/null
          set timeout=5
          set default=0

          menuentry "Ombra OS (KDE Plasma, Live)" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd.img
          }
          EOF

          # Копіюємо ядро та initrd з урахуванням прав
          sudo cp target/boot/vmlinuz-* iso/live/vmlinuz || sudo cp target/boot/vmlinuz iso/live/vmlinuz
          sudo cp target/boot/initrd.img-* iso/live/initrd.img || sudo cp target/boot/initrd.img iso/live/initrd.img

          sudo grub-mkrescue -o ombra-os.iso iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ombra-os-iso
          path: ombra-os.iso

