name: Build Ombra OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools debian-archive-keyring

      - name: Create chroot environment with GPG checks enabled
        run: |
          sudo debootstrap --arch=amd64 trixie chroot http://deb.debian.org/debian/

      - name: Mount virtual filesystems for chroot
        run: |
          sudo mount --bind /dev chroot/dev
          sudo mount --bind /dev/pts chroot/dev/pts
          sudo mount -t proc proc chroot/proc
          sudo mount -t sysfs sysfs chroot/sys

      - name: Copy repository assets to chroot
        run: |
          sudo mkdir -p chroot/usr/share/wallpapers/Ombra/contents/images \
                         chroot/usr/share/pixmaps \
                         chroot/etc/skel \
                         chroot/var/lib/AccountsService/icons \
                         chroot/usr/share/icons/hicolor/scalable/apps \
                         chroot/usr/share/icons/hicolor/48x48/apps

          # ASCII лого
          if [ -f "ombra_color.txt" ]; then
            sudo cp ombra_color.txt chroot/usr/share/ombra_color.txt
          elif [ -f "ombra_raw.txt" ]; then
            sudo cp ombra_raw.txt chroot/usr/share/ombra_color.txt
          fi

          # Шпалери
          if [ -f "wallpaper.png" ]; then
            sudo cp wallpaper.png chroot/usr/share/wallpapers/Ombra/contents/images/1920x1080.png
            sudo cp wallpaper.png chroot/usr/share/wallpapers/ombra_wallpaper.png
          elif [ -f "wallpaper.jpg" ]; then
            sudo cp wallpaper.jpg chroot/usr/share/wallpapers/Ombra/contents/images/1920x1080.png
            sudo cp wallpaper.jpg chroot/usr/share/wallpapers/ombra_wallpaper.png
          fi

          # 1. Основний Мінімалістичний logo.png -> Система, Меню Пуск, Calamares, Про систему
          if [ -f "logo.png" ]; then
            sudo cp logo.png chroot/usr/share/pixmaps/ombra-transparent.png
            sudo cp logo.png chroot/usr/share/pixmaps/ombra-logo.png
            sudo cp logo.png chroot/usr/share/pixmaps/ombra.png
            sudo cp logo.png chroot/usr/share/icons/hicolor/scalable/apps/ombra.png
            sudo cp logo.png chroot/usr/share/icons/hicolor/48x48/apps/ombra.png
          fi

          # 2. logob.png (з фоном) -> Аватарка користувача в SDDM та системі
          if [ -f "logob.png" ]; then
            sudo cp logob.png chroot/etc/skel/.face
            sudo cp logob.png chroot/var/lib/AccountsService/icons/ombra
          elif [ -f "logo.png" ]; then
            sudo cp logo.png chroot/etc/skel/.face
            sudo cp logo.png chroot/var/lib/AccountsService/icons/ombra
          fi

      - name: Install Pure KDE Plasma 6, Office, Multimedia & System Tools
        run: |
          sudo chroot chroot bash -ec '
          export DEBIAN_FRONTEND=noninteractive
          export DEBIAN_PRIORITY=critical

          mkdir -p /etc/apt/apt.conf.d
          echo "DPkg::Options { \"--force-confdef\"; \"--force-confold\"; };" > /etc/apt/apt.conf.d/99force-conf

          if [ -f /etc/apt/sources.list ]; then
            sed -i "s/main/main contrib non-free non-free-firmware/g" /etc/apt/sources.list
          fi
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/g" /etc/apt/sources.list.d/debian.sources
          fi

          apt-get update
          apt-get install -y linux-image-amd64 live-boot live-config live-config-systemd systemd-sysv initramfs-tools squashfs-tools

          mkdir -p /etc/initramfs-tools/conf.d
          echo "MODULES=most" > /etc/initramfs-tools/conf.d/driver-policy
          echo "overlay" >> /etc/initramfs-tools/modules
          echo "squashfs" >> /etc/initramfs-tools/modules
          echo "loop" >> /etc/initramfs-tools/modules
          echo "uas" >> /etc/initramfs-tools/modules
          echo "usb_storage" >> /etc/initramfs-tools/modules
          update-initramfs -u -k all

          # Пакети системи (Без || true для точного контролю помилок)
          apt-get install -y \
            plasma-workspace plasma-desktop firefox-esr plasma-discover konsole dolphin kate fastfetch htop cmatrix tty-clock \
            calamares calamares-settings-debian breeze-icon-theme plasma-nm plasma-pa sddm partitionmanager ark gwenview curl git sudo nano \
            network-manager polkitd pkexec bluez bluedevil usbutils dosfstools exfatprogs ntfs-3g firmware-linux-free \
            qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts kdeconnect \
            okular libreoffice libreoffice-plasma libreoffice-l10n-uk \
            kolourpaint elisa vlc clamtk clamav ffmpegthumbs

          # Видалення залишків брендингу Debian
          apt-get purge -y desktop-base plymouth-theme-debian-spinner base-files-extra || true
          apt-get install -f -y
          apt-get clean
          '

      - name: Configure Deep Ombra OS Branding & Total Icon Sweep
        run: |
          sudo chroot chroot bash -ec '
          mkdir -p /usr/share/ombra /etc/skel/.config/fastfetch /etc/fastfetch /root/.config/fastfetch /usr/share/icons/hicolor/scalable/apps /usr/share/icons/hicolor/48x48/apps /usr/lib /usr/share/icons/vendor
          
          rm -f /etc/os-release /usr/lib/os-release

          # Назва системи: Ombra OS
          cat << "EOF_OS" > /usr/lib/os-release
          NAME="Ombra OS"
          PRETTY_NAME="Ombra OS"
          ID=ombra
          ID_LIKE=debian
          HOME_URL="https://github.com/Braelfet/ombra-os"
          LOGO="ombra"
          EOF_OS

          ln -sf /usr/lib/os-release /etc/os-release

          echo "Ombra OS" > /etc/issue
          echo "Ombra OS" > /etc/issue.net
          echo "Ombra OS" > /etc/debian_version

          # Заміна системних емблем та іконок меню на новий logo.png
          if [ -f /usr/share/pixmaps/ombra-transparent.png ]; then
            P="/usr/share/pixmaps/ombra-transparent.png"
            
            cp $P /usr/share/pixmaps/debian-logo.png
            cp $P /usr/share/pixmaps/debian-logo.svg
            cp $P /usr/share/pixmaps/start-here.png 2>/dev/null || true
            cp $P /usr/share/pixmaps/start-here.svg 2>/dev/null || true
            
            find /usr/share/icons/ -type f \( -name "emblem-vendor*" -o -name "debian-logo*" -o -name "distro-debian*" -o -name "vendor-logo*" -o -name "*debian*" \) -exec cp $P {} \;
            
            mkdir -p /usr/share/desktop-base/common/images
            find /usr/share/desktop-base/ -type f -exec cp $P {} \; 2>/dev/null || true
            cp $P /usr/share/desktop-base/common/images/login-background.svg 2>/dev/null || true
          fi

          if [ -f /usr/share/ombra_color.txt ]; then
            cp /usr/share/ombra_color.txt /usr/share/ombra/ascii_logo.txt
          fi

          cat << "EOFF" > /etc/fastfetch/config.jsonc
          {
            "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
            "logo": {
              "type": "file",
              "source": "/usr/share/ombra/ascii_logo.txt",
              "color": {
                "1": "magenta",
                "2": "cyan"
              },
              "padding": {
                "top": 1,
                "left": 1,
                "right": 3
              }
            },
            "display": {
              "color": {
                "keys": "magenta",
                "title": "cyan"
              },
              "separator": " ➜  "
            },
            "modules": [
              "title",
              "separator",
              {"type": "os", "key": "OS", "keyColor": "magenta"},
              {"type": "host", "key": "Host", "keyColor": "magenta"},
              {"type": "kernel", "key": "Kernel", "keyColor": "magenta"},
              {"type": "uptime", "key": "Uptime", "keyColor": "magenta"},
              {"type": "packages", "key": "Packages", "keyColor": "magenta"},
              {"type": "shell", "key": "Shell", "keyColor": "magenta"},
              {"type": "display", "key": "Display", "keyColor": "magenta"},
              {"type": "de", "key": "DE", "keyColor": "magenta"},
              {"type": "wm", "key": "WM", "keyColor": "magenta"},
              {"type": "terminal", "key": "Terminal", "keyColor": "magenta"},
              {"type": "cpu", "key": "CPU", "keyColor": "magenta"},
              {"type": "gpu", "key": "GPU", "keyColor": "magenta"},
              {"type": "memory", "key": "Memory", "keyColor": "magenta"},
              "break",
              "colors"
            ]
          }
          EOFF

          cp /etc/fastfetch/config.jsonc /etc/skel/.config/fastfetch/config.jsonc
          cp /etc/fastfetch/config.jsonc /root/.config/fastfetch/config.jsonc
          
          # Запуск fastfetch тільки в інтерактивному терміналі
          echo '[[ $- == *i* ]] && fastfetch' >> /etc/skel/.bashrc
          echo '[[ $- == *i* ]] && fastfetch' >> /root/.bashrc
          '

      - name: Configure Calamares Installer & Shortcuts
        run: |
          sudo chroot chroot bash -ec '
          mkdir -p /etc/calamares /etc/calamares/branding/ombra /etc/skel/Desktop /usr/share/applications

          if [ -f /etc/calamares/settings.conf.bak ]; then
            cp /etc/calamares/settings.conf.bak /etc/calamares/settings.conf
          elif [ -f /usr/share/calamares/settings.conf ]; then
            cp /usr/share/calamares/settings.conf /etc/calamares/settings.conf || true
          fi

          sed -i "s/branding: .*/branding: ombra/" /etc/calamares/settings.conf || true

          cat << "EOF_CAL_BRAND" > /etc/calamares/branding/ombra/branding.desc
          ---
          componentName:  ombra
          welcomeStyleCalamares: true
          welcomeExpandingWallpaper: true

          strings:
            productName:         "Ombra OS"
            shortProductName:    "Ombra"
            version:             ""
            shortVersion:        ""
            versionedName:       "Ombra OS"
            shortVersionedName:  "Ombra OS"
            bootloaderEntryName: "Ombra OS"
            productUrl:          "https://github.com/Braelfet/ombra-os"

          images:
            productLogo:         "/usr/share/pixmaps/ombra-transparent.png"
            productIcon:         "/usr/share/pixmaps/ombra-transparent.png"

          slideshow:             "show.qml"

          style:
            sidebarBackground:    "#1e1e2e"
            sidebarText:          "#cdd6f4"
            sidebarTextSelect:    "#cba6f7"
            sidebarTextHighlight: "#89b4fa"
          EOF_CAL_BRAND

          cat << "EOF_QML" > /etc/calamares/branding/ombra/show.qml
          import QtQuick 2.0;
          import calamares.slideshow 1.0;

          Presentation {
              id: presentation
              Timer {
                  interval: 10000
                  running: true
                  repeat: true
                  onTriggered: presentation.goToNextSlide()
              }
              Slide {
                  Text {
                      anchors.centerIn: parent
                      text: "Welcome to Ombra OS!"
                      color: "#cdd6f4"
                      font.pixelSize: 20
                  }
              }
          }
          EOF_QML

          rm -f /usr/share/applications/install-debian.desktop /usr/share/applications/calamares.desktop /usr/share/applications/install-media.desktop || true

          # Ярлик інсталятора "Install Ombra OS"
          cat << "EOF_DESKTOP" > /usr/share/applications/install-ombra.desktop
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Install Ombra OS
          GenericName=System Installer
          Comment=Install Ombra OS permanently on your computer
          Exec=pkexec calamares
          Icon=ombra-transparent
          Terminal=false
          Categories=System;
          X-KDE-SubstituteUID=true
          EOF_DESKTOP

          cp /usr/share/applications/install-ombra.desktop /etc/skel/Desktop/ || true

          # Ярлики Робочого столу
          cat << "EOF_THIS_PC" > /etc/skel/Desktop/this-pc.desktop
          [Desktop Entry]
          Type=Application
          Name=This PC
          Comment=Open Computer Overview
          Exec=dolphin root:/
          Icon=computer
          Terminal=false
          Categories=System;
          EOF_THIS_PC

          cat << "EOF_HOME" > /etc/skel/Desktop/home.desktop
          [Desktop Entry]
          Type=Application
          Name=Home
          Comment=Open User Home Folder
          Exec=dolphin %u
          Icon=user-home
          Terminal=false
          Categories=System;
          EOF_HOME

          cat << "EOF_TRASH" > /etc/skel/Desktop/trash.desktop
          [Desktop Entry]
          Type=Application
          Name=Trash
          Comment=Open Trash Can
          Exec=dolphin trash:/
          Icon=user-trash
          Terminal=false
          Categories=System;
          EOF_TRASH

          chmod +x /etc/skel/Desktop/*.desktop || true
          '

      - name: Configure Live Environment Permissions & Cleanup Post-Install
        run: |
          sudo chroot chroot bash -ec '
          mkdir -p /etc/skel/.config /etc/skel/.config/autostart /usr/local/bin /etc/polkit-1/rules.d /etc/sudoers.d
          
          # NOPASSWD та розширений Polkit суто для Live-режиму
          echo "ALL ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-live-nopasswd
          chmod 0440 /etc/sudoers.d/99-live-nopasswd

          cat << "EOF_POLKIT" > /etc/polkit-1/rules.d/49-live-nopasswd.rules
          polkit.addRule(function(action, subject) {
              if (subject.isInGroup("live") || subject.user == "ombra") {
                  return polkit.Result.YES;
              }
          });
          EOF_POLKIT

          # Hook для Calamares: видалення привілеїв без пароля після інсталяції на диск
          mkdir -p /etc/calamares/scripts
          cat << "EOF_CLEANUP" > /etc/calamares/scripts/remove-live-permissions.sh
          #!/bin/bash
          rm -f /target/etc/sudoers.d/99-live-nopasswd
          rm -f /target/etc/polkit-1/rules.d/49-live-nopasswd.rules
          EOF_CLEANUP
          chmod +x /etc/calamares/scripts/remove-live-permissions.sh

          cat << "EOF_KDE" > /etc/skel/.config/kdeglobals
          [General]
          ColorScheme=BreezeDark
          [KDE]
          LookAndFeelPackage=org.kde.breezedark.desktop
          EOF_KDE

          mkdir -p /etc/NetworkManager/conf.d
          cat << "EOF_NM" > /etc/NetworkManager/conf.d/no-kwallet.conf
          [main]
          systemd-resolved=true
          EOF_NM

          # Автоматичне встановлення значка меню «Пуск» на новий logo.png
          cat << "EOF_SCRIPT" > /usr/local/bin/ombra-init-desktop
          #!/bin/bash
          sleep 2
          dbus-send --session --dest=org.kde.plasmashell --type=method_call /PlasmaShell org.kde.PlasmaShell.evaluateScript "string:
          if (panels().length === 0) {
              var panel = new Panel();
              panel.location = 'bottom';
              panel.height = 44;
              var kickoff = panel.addWidget('org.kde.plasma.kickoff');
              if (kickoff) {
                  kickoff.currentConfigGroup = Array('General');
                  kickoff.writeConfig('icon', '/usr/share/pixmaps/ombra-transparent.png');
              }
              panel.addWidget('org.kde.plasma.pager');
              panel.addWidget('org.kde.plasma.icontasks');
              panel.addWidget('org.kde.plasma.marginsseparator');
              panel.addWidget('org.kde.plasma.systemtray');
              panel.addWidget('org.kde.plasma.digitalclock');
          }
          var Desktops = desktops();
          for (var i=0; i<Desktops.length; i++) {
              var d = Desktops[i];
              d.wallpaperPlugin = 'org.kde.image';
              d.currentConfigGroup = Array('Wallpaper', 'org.kde.image', 'General');
              d.writeConfig('Image', 'file:///usr/share/wallpapers/ombra_wallpaper.png');
          }
          "
          EOF_SCRIPT
          chmod +x /usr/local/bin/ombra-init-desktop

          # Оновлення кешу системних ікон
          gtk-update-icon-cache /usr/share/icons/hicolor || true
          '

      - name: Configure Live User (ombra) and Guaranteed SDDM Autologin
        run: |
          sudo chroot chroot bash -ec '
          useradd -m -s /bin/bash ombra || true
          echo "ombra:ombra" | chpasswd
          usermod -aG sudo,audio,video,plugdev,netdev ombra || true
          
          mkdir -p /home/ombra/.config /home/ombra/Desktop
          cp -r /etc/skel/.config/* /home/ombra/.config/ || true
          cp /etc/skel/.bashrc /home/ombra/.bashrc || true
          
          if [ -d /etc/skel/Desktop ]; then
            cp -r /etc/skel/Desktop/* /home/ombra/Desktop/ || true
            chmod +x /home/ombra/Desktop/*.desktop || true
          fi

          if [ -f /etc/skel/.face ]; then
            cp /etc/skel/.face /home/ombra/.face || true
          fi
          
          chown -R ombra:ombra /home/ombra

          # SDDM Autologin для Live-сесії
          mkdir -p /etc/sddm.conf.d
          cat << "EOF_SDDM" > /etc/sddm.conf.d/autologin.conf
          [Autologin]
          User=ombra
          Session=
          Relogin=false

          [Theme]
          Current=breeze
          EOF_SDDM

          mkdir -p /etc/live/config.conf.d
          echo "LIVE_USERNAME=ombra" > /etc/live/config.conf.d/ombra.conf
          '

      - name: Unmount virtual filesystems before packing
        run: |
          sudo umount -l chroot/dev/pts || true
          sudo umount -l chroot/dev || true
          sudo umount -l chroot/proc || true
          sudo umount -l chroot/sys || true

      - name: Prepare ISO Structure and GRUB Boot Config
        run: |
          mkdir -p iso/live iso/boot/grub
          
          sudo cp chroot/boot/vmlinuz-* iso/live/vmlinuz
          sudo cp chroot/boot/initrd.img-* iso/live/initrd.img
          
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz
          
          cat << 'EOF' > iso/boot/grub/grub.cfg
          set default=0
          set timeout=3
          menuentry "Ombra OS (KDE Plasma 6)" {
              linux /live/vmlinuz boot=live quiet username=ombra hostname=ombra
              initrd /live/initrd.img
          }
          menuentry "Ombra OS (Failsafe Mode)" {
              linux /live/vmlinuz boot=live nomodeset username=ombra hostname=ombra
              initrd /live/initrd.img
          }
          EOF

      - name: Build ISO Image & Generate Checksum
        run: |
          grub-mkrescue -o ombra-os-trixie-kde.iso iso/
          sha256sum ombra-os-trixie-kde.iso > SHA256SUMS.txt

      - name: Upload ISO Artifact & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: Ombra-OS-ISO
          path: |
            ombra-os-trixie-kde.iso
            SHA256SUMS.txt
            
