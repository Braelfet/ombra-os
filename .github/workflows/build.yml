name: Build Ombra OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Create chroot environment
        run: |
          sudo debootstrap --arch=amd64 trixie chroot http://deb.debian.org/debian/

      - name: Copy repository assets to chroot
        run: |
          sudo mkdir -p chroot/usr/share/wallpapers chroot/usr/share/pixmaps
          sudo cp ombra_color.txt chroot/usr/share/ombra_color.txt || true
          sudo cp wallpaper.png chroot/usr/share/wallpapers/ombra_wallpaper.png || true
          sudo cp logo.png chroot/usr/share/pixmaps/ombra_logo.png || true

      - name: Configure Ombra OS branding and Fastfetch
        run: |
          sudo chroot chroot bash -c '
          mkdir -p /usr/share/ombra /etc/skel/.config/fastfetch
          
          echo "NAME=\"Ombra OS\"" > /etc/os-release
          echo "VERSION=\"1.0 (Trixie)\"" >> /etc/os-release
          echo "ID=ombra" >> /etc/os-release
          echo "ID_LIKE=debian" >> /etc/os-release
          echo "PRETTY_NAME=\"Ombra OS Trixie/Testing\"" >> /etc/os-release
          echo "VERSION_ID=\"1.0\"" >> /etc/os-release
          echo "HOME_URL=\"https://github.com/Braelfet/ombra-os\"" >> /etc/os-release

          if [ -f /usr/share/ombra_color.txt ]; then
            cp /usr/share/ombra_color.txt /usr/share/ombra/ascii_logo.txt
          fi

          echo "{" > /etc/skel/.config/fastfetch/config.jsonc
          echo "  \"\$schema\": \"https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json\"," >> /etc/skel/.config/fastfetch/config.jsonc
          echo "  \"logo\": {" >> /etc/skel/.config/fastfetch/config.jsonc
          echo "    \"type\": \"raw\"," >> /etc/skel/.config/fastfetch/config.jsonc
          echo "    \"source\": \"/usr/share/ombra/ascii_logo.txt\"" >> /etc/skel/.config/fastfetch/config.jsonc
          echo "  }" >> /etc/skel/.config/fastfetch/config.jsonc
          echo "}" >> /etc/skel/.config/fastfetch/config.jsonc
          '

      - name: Install Desktop Environment (KDE Plasma 6) & Packages
        run: |
          sudo chroot chroot bash -c '
          apt-get update
          apt-get install -y linux-image-amd64 live-boot systemd-sysv
          apt-get install -y plasma-desktop konsole dolphin kate fastfetch htop cmatrix tty-clock calamares
          apt-get clean
          '

      - name: Configure Live User (ombra)
        run: |
          sudo chroot chroot bash -c '
          useradd -m -s /bin/bash ombra || true
          echo "ombra:ombra" | chpasswd
          usermod -aG sudo ombra || true
          mkdir -p /home/ombra/.config/fastfetch
          cp -r /etc/skel/.config/fastfetch/* /home/ombra/.config/fastfetch/ || true
          chown -R ombra:ombra /home/ombra
          '

      - name: Build SquashFS and ISO Image
        run: |
          mkdir -p iso/live
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz
          grub-mkrescue -o ombra-os-trixie-kde.iso iso/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ombra-OS-ISO
          path: ombra-os-trixie-kde.iso

