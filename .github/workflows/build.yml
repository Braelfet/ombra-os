name: Build Ombra OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools udev

      - name: Bootstrap Debian Trixie (testing)
        run: |
          sudo debootstrap --arch=amd64 trixie chroot http://deb.debian.org/debian/

      - name: Configure and Install Pure KDE Plasma 6, Firefox & Tools
        run: |
          sudo chroot chroot bash -ec '
          export DEBIAN_FRONTEND=noninteractive
          export DEBIAN_PRIORITY=critical

          mkdir -p /etc/apt/apt.conf.d
          echo "DPkg::Options { \"--force-confdef\"; \"--force-confold\"; };" > /etc/apt/apt.conf.d/99force-conf

          apt-get update
          
          # Явно вказуємо модулі для live-boot в initramfs
          mkdir -p /etc/initramfs-tools/conf.d
          echo "BOOT=live" > /etc/initramfs-tools/conf.d/live.conf
          
          cat << "EOF_MOD" >> /etc/initramfs-tools/modules
          loop
          overlay
          squashfs
          isofs
          EOF_MOD

          # Встановлюємо ядро та компоненти live-boot
          apt-get install -y linux-image-amd64 live-boot live-config live-config-systemd systemd-sysv wget curl squashfs-tools

          # Встановлюємо робоче середовище, Calamares та інструменти
          apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            plasma-workspace plasma-desktop firefox-esr plasma-discover konsole dolphin kate fastfetch htop cmatrix tty-clock calamares calamares-settings-debian breeze-icon-theme plasma-nm plasma-pa sddm kdeconnect partitionmanager ark gwenview git sudo nano network-manager polkitd pkexec || true
          
          # Оновлюємо initramfs з новими модулями
          update-initramfs -u -k all

          # Перевіряємо конфігуратор Calamares
          if [ ! -f /etc/calamares/settings.conf ] && [ -f /etc/calamares/settings.conf.debian ]; then
            cp /etc/calamares/settings.conf.debian /etc/calamares/settings.conf
          fi
          
          apt-get install -f -y
          apt-get clean
          '

      - name: Prepare ISO Structure and GRUB Boot Config
        run: |
          mkdir -p iso/live iso/boot/grub
          
          VMLINUZ=$(ls chroot/boot/vmlinuz-* | sort -V | tail -n 1)
          INITRD=$(ls chroot/boot/initrd.img-* | sort -V | tail -n 1)
          
          sudo cp "$VMLINUZ" iso/live/vmlinuz
          sudo cp "$INITRD" iso/live/initrd.img
          
          sudo mksquashfs chroot iso/live/filesystem.squashfs -comp xz -e proc sys dev run
          
          cat << 'EOF' > iso/boot/grub/grub.cfg
          set default=0
          set timeout=3
          menuentry "Ombra OS 1.0 (KDE Plasma 6)" {
              linux /live/vmlinuz boot=live components live-media-path=/live ignore_uuid
              initrd /live/initrd.img
          }
          menuentry "Ombra OS 1.0 (Failsafe Mode)" {
              linux /live/vmlinuz boot=live components live-media-path=/live ignore_uuid nomodeset
              initrd /live/initrd.img
          }
          EOF

      - name: Build Hybrid Bootable ISO Image
        run: |
          grub-mkrescue -o ombra-os-1.0-amd64.iso iso/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ombra-os-1.0-iso
          path: ombra-os-1.0-amd64.iso
          compression-level: 0

